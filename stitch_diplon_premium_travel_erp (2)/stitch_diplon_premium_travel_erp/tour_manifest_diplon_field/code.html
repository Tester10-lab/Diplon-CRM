<script>
        // Micro-interaction for toggles
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const card = this.closest('.pax-card');
                const isChecked = card.getAttribute('data-checked') === 'true';
                const statusStrip = card.querySelector('.status-strip');
                const checkboxBox = this.querySelector('.checkbox-box');
                const checkIcon = checkboxBox.querySelector('span');
                const nameText = card.querySelector('.font-bold.text-on-background, .font-bold.text-on-surface-variant');

                if (isChecked) {
                    // Turn Off
                    card.setAttribute('data-checked', 'false');
                    card.classList.replace('bg-surface-container', 'bg-surface-container-low');
                    card.classList.replace('border-outline-variant/60', 'border-outline-variant/40');
                    card.classList.add('opacity-90');
                    
                    statusStrip.classList.replace('bg-secondary', 'bg-outline-variant/50');
                    
                    checkboxBox.classList.remove('bg-secondary', 'border-secondary', 'shadow-[0_1px_2px_rgba(0,0,0,0.5)]');
                    checkboxBox.classList.add('bg-transparent', 'border-outline', 'shadow-inner');
                    
                    checkIcon.classList.replace('text-on-secondary', 'text-transparent');
                    
                    nameText.classList.replace('text-on-background', 'text-on-surface-variant');
                } else {
                    // Turn On
                    card.setAttribute('data-checked', 'true');
                    card.classList.replace('bg-surface-container-low', 'bg-surface-container');
                    card.classList.replace('border-outline-variant/40', 'border-outline-variant/60');
                    card.classList.remove('opacity-90');
                    
                    statusStrip.classList.replace('bg-outline-variant/50', 'bg-secondary');
                    
                    checkboxBox.classList.remove('bg-transparent', 'border-outline', 'shadow-inner');
                    checkboxBox.classList.add('bg-secondary', 'border-secondary', 'shadow-[0_1px_2px_rgba(0,0,0,0.5)]');
                    
                    checkIcon.classList.replace('text-transparent', 'text-on-secondary');
                    
                    nameText.classList.replace('text-on-surface-variant', 'text-on-background');
                }

                // Update Counters (Simple simulation)
                const total = document.querySelectorAll('.pax-card').length;
                const checked = document.querySelectorAll('.pax-card[data-checked="true"]').length;
                
                document.getElementById('checked-count').textContent = checked;
                
                const percentage = (checked / total) * 100;
                document.getElementById('progress-ring').setAttribute('stroke-dasharray', `${percentage}, 100`);
            });
        });
    </script>
